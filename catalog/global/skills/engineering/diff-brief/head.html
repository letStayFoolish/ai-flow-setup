<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff brief</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e3df;
  --card:#ffffff; --code:#f4f4f1; --accent:#2f5d7c; --warn:#8a5a00;
  --warn-bg:#fdf5e4; --bad:#8c2f2f; --bad-bg:#fbefef; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181a; --fg:#e6e6e3; --muted:#9a9a94; --line:#2c2f33;
  --card:#1d2023; --code:#111315; --accent:#8fbcd8; --warn:#d8ab52;
  --warn-bg:#2a2317; --bad:#e08585; --bad-bg:#2a1a1a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
main{max-width:980px;margin:0 auto;padding:40px 24px 120px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:48px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:28px}
.sub code{font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.banner{border-radius:8px;padding:10px 14px;margin:0 0 10px;font-size:.9rem;
  background:var(--warn-bg);color:var(--warn);border:1px solid currentColor}
.banner.info{background:var(--card);color:var(--muted);border-color:var(--line)}
.claim{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin:0 0 12px}
.claim .n{color:var(--muted);font-family:var(--mono);font-size:.8rem;margin-right:8px}
.claim .t{white-space:pre-wrap}
.claim.undet{border-left:3px solid var(--warn)}
.claim.rej{background:var(--bad-bg);border-color:var(--bad)}
.mark{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);
  border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:2px}
.mark.bad{color:var(--bad)}
.reason{color:var(--bad);font-size:.85rem;margin-top:8px}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.76rem;background:var(--code);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
pre{font-family:var(--mono);font-size:.8rem;line-height:1.5;background:var(--code);
  border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:10px 0 0}
pre .add{color:#2e7d32}
pre .del{color:#b23b3b}
pre .hh{color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:.84rem}
summary:hover{color:var(--accent)}
.files{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:8px}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.85rem}
footer code{font-family:var(--mono);background:var(--code);padding:2px 6px;border-radius:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.82rem;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<main id="doc"></main>
<div class="toast" id="toast"></div>
<script id="brief-data" type="application/json">
